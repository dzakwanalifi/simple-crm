<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SimpleCRM{% endblock %}</title>
    <!-- Link ke CSS (buat file ini nanti) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="container">
      <h1>Simple CRM</h1>
      <hr>

      <!-- Tempat untuk menampilkan flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
          {% for category, message in messages %}
            <div class="alert alert-{{ category or 'info' }}">{{ message }}</div>
          {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <!-- Konten utama dari halaman lain akan masuk di sini -->
      {% block content %}{% endblock %}

    </div>
    <!-- Optional: Link ke Javascript jika perlu -->
  </body>
</html>
